# Grimoire book configuration for the @jennifer/telegram documentation.

[book]
title = "@jennifer/telegram"
description = "A Telegram Bot API client"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "carbon"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://jennifer-language.github.io/deck-telegram/"
repoUrl = "https://github.com/jennifer-language/deck-telegram"
repoLabel = "Source"
editUrl = "https://github.com/jennifer-language/deck-telegram/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
